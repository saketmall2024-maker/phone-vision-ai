<!DOCTYPE html>
<html>
<head>
    <title>Face Unlock</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            text-align: center;
            background: #111;
            color: white;
            font-family: Arial;
        }

        #result {
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
        }

        .granted {
            background: #00c853;
        }

        .denied {
            background: #d50000;
        }
    </style>
</head>

<body>

<h1>🔐 Face Unlock System</h1>

<button onclick="init()">Start</button>

<div id="webcam-container"></div>
<div id="result" class="denied">ACCESS DENIED 🚫</div>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/O2Ehy__UJ/";

let model, webcam, maxPredictions;

let confirmCount = 0;
let lastState = "";

// 🔊 SPEAK FUNCTION
function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    window.speechSynthesis.speak(speech);
}

async function init() {
    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();

    webcam = new tmImage.Webcam(300, 300, true);
    await webcam.setup();
    await webcam.play();

    document.getElementById("webcam-container").appendChild(webcam.canvas);

    window.requestAnimationFrame(loop);
}

async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
}

async function predict() {
    const prediction = await model.predict(webcam.canvas);

    let youProb = 0;

    for (let i = 0; i < prediction.length; i++) {
        if (prediction[i].className === "YOU") {
            youProb = prediction[i].probability;
        }
    }

    // 🔐 STABLE DETECTION
    if (youProb > 0.9) {
        confirmCount++;
    } else {
        confirmCount = 0;
    }

    let state;
    if (confirmCount > 15) {
        state = "GRANTED";
    } else {
        state = "DENIED";
    }

    let resultDiv = document.getElementById("result");

    // 🔥 UPDATE ONLY WHEN CHANGED
    if (state !== lastState) {
        lastState = state;

        if (state === "GRANTED") {
            resultDiv.innerHTML = "WELCOME SAKKU 😎";
            resultDiv.className = "granted";
            speak("Welcome Sakku");
        } else {
            resultDiv.innerHTML = "ACCESS DENIED 🚫";
            resultDiv.className = "denied";
            speak("Access Denied");
        }
    }
}
</script>

</body>
</html>
