<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesture AI</title>

<style>
body {
    text-align: center;
    background: #111;
    color: white;
    font-family: Arial;
}

#result {
    font-size: 34px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h2>Gesture AI</h2>
<button onclick="init()">Start</button>

<div id="webcam-container"></div>
<div id="result">Waiting...</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.9.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/gWXOPXYeG/";

let model, webcam;
let lastSent = "";

async function init() {
    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);

    webcam = new tmImage.Webcam(250, 250, true);
    await webcam.setup();
    await webcam.play();

    document.getElementById("webcam-container").appendChild(webcam.canvas);

    loop();
}

async function loop() {
    webcam.update();
    await predict();
    requestAnimationFrame(loop);
}

async function predict() {

    const prediction = await model.predict(webcam.canvas);

    let bestClass = "";
    let bestProb = 0;

    for (let i = 0; i < prediction.length; i++) {
        if (prediction[i].probability > bestProb) {
            bestProb = prediction[i].probability;
            bestClass = prediction[i].className;
        }
    }

    let state = "NONE";

    if (bestClass.toLowerCase().includes("up")) state = "UP";
    else if (bestClass.toLowerCase().includes("down")) state = "DOWN";

    document.getElementById("result").innerHTML =
        state + " (" + (bestProb * 100).toFixed(2) + "%)";

    // 🚀 ONLY SEND IF CHANGED
    if (state !== lastSent && state !== "NONE") {
        lastSent = state;
        sendToPython(state);
    }
}

// ✅ SEND TO PYTHON BRIDGE (NOT ESP DIRECT)
function sendToPython(state) {
    console.log("Sending:", state);

    fetch("http://127.0.0.1:5000/send?cmd=" + state)
    .catch(err => console.log("Bridge error:", err));
}
</script>

</body>
</html>
