<!DOCTYPE html>
<html>
<head>
    <title>Face Unlock</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            text-align: center;
            background: #111;
            color: white;
            font-family: Arial;
        }

        #result {
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
            padding: 12px;
            border-radius: 10px;
            display: inline-block;
        }

        .granted {
            background: #00c853;
        }

        .denied {
            background: #d50000;
        }
    </style>
</head>

<body>

<h1>🔐 Face Unlock System</h1>

<button onclick="init()">Start</button>

<div id="webcam-container"></div>
<div id="result" class="denied">ACCESS DENIED 🚫</div>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/vqlFxlMRf/";

let model, webcam;

let confirmCount = 0;
let lastState = "";

async function init() {
    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);

    webcam = new tmImage.Webcam(300, 300, true);
    await webcam.setup();
    await webcam.play();

    document.getElementById("webcam-container").appendChild(webcam.canvas);

    window.requestAnimationFrame(loop);
}

async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
}

async function predict() {
    const prediction = await model.predict(webcam.canvas);

    let youProb = 0;

    for (let i = 0; i < prediction.length; i++) {
        if (prediction[i].className === "SAKET") {
            youProb = prediction[i].probability;
        }
    }

    // 🔐 STABLE DETECTION
    if (youProb > 0.9) {
        confirmCount++;
    } else {
        confirmCount = 0;
    }

    let state;
    if (confirmCount > 15) {
        state = "GRANTED";
    } else {
        state = "DENIED";
    }

    let resultDiv = document.getElementById("result");

    if (state !== lastState) {
        lastState = state;

        if (state === "GRANTED") {
            resultDiv.innerHTML = "WELCOME SAKKU 😎";
            resultDiv.className = "granted";
        } else {
            resultDiv.innerHTML = "ACCESS DENIED 🚫";
            resultDiv.className = "denied";
        }
    }
}
</script>

</body>
</html>
