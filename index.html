<!DOCTYPE html>
<html>
<head>
    <title>AI Vision Controller</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #111;
            color: white;
        }

        h1 {
            margin-top: 20px;
        }

        button, input {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }

        #webcam-container, #image-preview {
            margin-top: 20px;
        }

        img, canvas {
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>🔥 AI Vision Controller</h1>
    <p>Click anywhere to start camera</p>

    <input type="file" id="upload" accept="image/*">

    <div id="webcam-container"></div>
    <div id="image-preview"></div>

    <h2 id="result">Loading model...</h2>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/OEa3xEPNg/";

        let model, webcam, started = false;

        async function loadModel() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            document.getElementById("result").innerText = "Click screen to start camera";
        }

        loadModel();

        // Start camera on first click (browser security requirement)
        document.body.addEventListener("click", async () => {
            if (started) return;
            started = true;

            document.getElementById("result").innerText = "Starting camera...";

            webcam = new tmImage.Webcam(250, 250, true);

            try {
                await webcam.setup();
                await webcam.play();
            } catch (e) {
                document.getElementById("result").innerText = "Camera permission denied ❌";
                return;
            }

            document.getElementById("webcam-container").appendChild(webcam.canvas);

            loop();
        });

        async function loop() {
            if (!webcam) return;
            webcam.update();
            await predict(webcam.canvas);
            requestAnimationFrame(loop);
        }

        // Upload image handler
        document.getElementById("upload").addEventListener("change", async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const img = document.createElement("img");
            img.src = URL.createObjectURL(file);
            img.width = 250;

            document.getElementById("image-preview").innerHTML = "";
            document.getElementById("image-preview").appendChild(img);

            img.onload = async () => {
                await predict(img);
            };
        });

        // Prediction logic (best result only)
        async function predict(image) {
            if (!model) return;

            const prediction = await model.predict(image);

            let best = prediction[0];

            for (let i = 1; i < prediction.length; i++) {
                if (prediction[i].probability > best.probability) {
                    best = prediction[i];
                }
            }

            document.getElementById("result").innerText =
                best.className + " (" + (best.probability * 100).toFixed(2) + "%)";
        }
    </script>

</body>
</html>
