<!DOCTYPE html>
<html>
<head>
    <title>AI Vision Auto</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #111;
            color: white;
        }

        h1 {
            margin-top: 20px;
        }

        #webcam-container {
            margin-top: 20px;
        }

        canvas {
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>🔥 AI Vision Auto Start</h1>
    <p>Tap anywhere once to start</p>

    <div id="webcam-container"></div>
    <h2 id="result">Loading model...</h2>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/Ccfgx1Ac5/";

        let model, webcam, started = false;

        async function loadModel() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);

            document.getElementById("result").innerText = "Tap anywhere to start camera";
        }

        loadModel();

        async function startCamera() {
            if (started) return;
            started = true;

            document.getElementById("result").innerText = "Starting camera...";

            webcam = new tmImage.Webcam(250, 250, true);

            try {
                await webcam.setup();
                await webcam.play();
            } catch (e) {
                document.getElementById("result").innerText = "Camera blocked ❌";
                return;
            }

            document.getElementById("webcam-container").appendChild(webcam.canvas);

            loop();
        }

        // 👇 AUTO START ON ANY CLICK / TAP
        document.body.addEventListener("click", startCamera);
        document.body.addEventListener("touchstart", startCamera);

        async function loop() {
            if (!webcam) return;

            webcam.update();
            await predict(webcam.canvas);

            requestAnimationFrame(loop);
        }

        async function predict(image) {
            if (!model) return;

            const prediction = await model.predict(image);

            let best = prediction[0];

            for (let i = 1; i < prediction.length; i++) {
                if (prediction[i].probability > best.probability) {
                    best = prediction[i];
                }
            }

            document.getElementById("result").innerText =
                best.className + " (" + (best.probability * 100).toFixed(2) + "%)";
        }
    </script>

</body>
</html>
