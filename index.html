<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesture AI</title>

<style>
body {
    text-align: center;
    background: #111;
    color: white;
    font-family: Arial;
}

#result {
    font-size: 34px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h2>Gesture AI</h2>
<button onclick="init()">Start</button>

<div id="webcam-container"></div>
<div id="result">Waiting...</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.9.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/gWXOPXYeG/";

let model, webcam;
let lastSent = "";

async function init() {
    model = await tmImage.load(URL + "model.json", URL + "metadata.json");

    webcam = new tmImage.Webcam(250, 250, true);
    await webcam.setup();
    await webcam.play();

    document.getElementById("webcam-container").appendChild(webcam.canvas);

    loop();
}

async function loop() {
    webcam.update();
    await predict();
    requestAnimationFrame(loop);
}

async function predict() {
    const prediction = await model.predict(webcam.canvas);

    let bestClass = "";
    let bestProb = 0;

    for (let i = 0; i < prediction.length; i++) {
        if (prediction[i].probability > bestProb) {
            bestProb = prediction[i].probability;
            bestClass = prediction[i].className;
        }
    }

    let output = "NONE";

    if (bestClass.toLowerCase().includes("up")) output = "UP";
    else if (bestClass.toLowerCase().includes("down")) output = "DOWN";

    document.getElementById("result").innerHTML = output;

    // 🚨 PREVENT SPAM (VERY IMPORTANT FIX)
    if (output !== lastSent) {
        lastSent = output;
        sendToESP(output);
    }
}

function sendToESP(state) {
    const espIP = "http://192.168.0.100";

    fetch(`${espIP}/${state}`)
    .then(r => r.text())
    .then(d => console.log("ESP:", d))
    .catch(e => console.log("ESP ERROR:", e));
}
</script>

</body>
</html>
