<!DOCTYPE html>
<html>
<head>
    <title>AI Vision Controller</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #111;
            color: white;
        }

        button, input {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }

        #webcam-container, #image-preview {
            margin-top: 20px;
        }

        img {
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>🔥 AI Vision Controller</h1>

    <button onclick="startCamera()">Start Camera</button>
    <br>
    <input type="file" id="upload" accept="image/*">

    <div id="webcam-container"></div>
    <div id="image-preview"></div>

    <h2 id="result">Waiting...</h2>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/OEa3xEPNg/";

        let model, webcam;

        async function loadModel() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            model = await tmImage.load(modelURL, metadataURL);
        }

        loadModel();

        async function startCamera() {
            webcam = new tmImage.Webcam(250, 250, true);
            await webcam.setup();
            await webcam.play();

            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);

            loop();
        }

        async function loop() {
            webcam.update();
            await predict(webcam.canvas);
            requestAnimationFrame(loop);
        }

        document.getElementById("upload").addEventListener("change", async function(event) {
            const file = event.target.files[0];
            const img = document.createElement("img");

            img.src = URL.createObjectURL(file);
            img.width = 250;

            document.getElementById("image-preview").innerHTML = "";
            document.getElementById("image-preview").appendChild(img);

            img.onload = async () => {
                await predict(img);
            };
        });

        async function predict(image) {
            const prediction = await model.predict(image);

            let best = prediction[0];

            for (let i = 1; i < prediction.length; i++) {
                if (prediction[i].probability > best.probability) {
                    best = prediction[i];
                }
            }

            document.getElementById("result").innerText =
                best.className + " (" + (best.probability * 100).toFixed(2) + "%)";
        }
    </script>

</body>
</html>
