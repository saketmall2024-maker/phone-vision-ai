<!DOCTYPE html>
<html>
<head>
    <title>AI Vision FIXED</title>
    <style>
        body {
            background: #111;
            color: white;
            text-align: center;
            font-family: Arial;
        }
        canvas {
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>🔥 AI Vision Working</h1>
<h2 id="status">Loading...</h2>
<div id="webcam-container"></div>

<!-- ✅ LOAD LIBRARIES FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/Ccfgx1Ac5/";

let model, webcam;

async function init() {
    try {
        document.getElementById("status").innerText = "Loading model...";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);

        document.getElementById("status").innerText = "Click to start camera";

    } catch (e) {
        document.getElementById("status").innerText = "Model load failed ❌";
        console.error(e);
    }
}

init();

async function startCamera() {
    try {
        document.getElementById("status").innerText = "Starting camera...";

        webcam = new tmImage.Webcam(300, 300, true);

        await webcam.setup();
        await webcam.play();

        document.getElementById("webcam-container").appendChild(webcam.canvas);

        document.getElementById("status").innerText = "Camera running ✅";

        loop();

    } catch (e) {
        document.getElementById("status").innerText = "Camera error ❌";
        console.error(e);
    }
}

document.body.addEventListener("click", startCamera, { once: true });

async function loop() {
    webcam.update();
    await predict();
    requestAnimationFrame(loop);
}

async function predict() {
    const prediction = await model.predict(webcam.canvas);

    let best = prediction[0];

    for (let i = 1; i < prediction.length; i++) {
        if (prediction[i].probability > best.probability) {
            best = prediction[i];
        }
    }

    document.getElementById("status").innerText =
        best.className + " (" + (best.probability * 100).toFixed(2) + "%)";
}
</script>

</body>
</html>
