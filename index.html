<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Gesture Broadcast</title>

<style>
body {
    text-align: center;
    background: #111;
    color: white;
    font-family: Arial;
}
#result {
    font-size: 30px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h2>AI Gesture Broadcast</h2>
<button onclick="init()">Start</button>

<div id="webcam-container"></div>
<div id="result">Waiting...</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/gWXOPXYeG/";

let model, webcam;

async function init() {
    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);

    webcam = new tmImage.Webcam(200, 200, true);
    await webcam.setup();
    await webcam.play();

    document.getElementById("webcam-container").appendChild(webcam.canvas);

    loop();
}

async function loop() {
    webcam.update();
    await predict();
    requestAnimationFrame(loop);
}

async function predict() {
    const prediction = await model.predict(webcam.canvas);

    let bestClass = "";
    let bestProb = 0;

    for (let i = 0; i < prediction.length; i++) {
        if (prediction[i].probability > bestProb) {
            bestProb = prediction[i].probability;
            bestClass = prediction[i].className;
        }
    }

    let output = "NOTHING";

    if (bestProb > 0.85) {
        if (bestClass.toLowerCase().includes("up")) {
            output = "UP";
        } else if (bestClass.toLowerCase().includes("down")) {
            output = "DOWN";
        }
    }

    // SHOW ON SCREEN
    document.getElementById("result").innerHTML =
        output + " (" + (bestProb * 100).toFixed(1) + "%)";

    // 🔥 BROADCAST (THIS IS IMPORTANT)
    window.currentResult = output;
}
</script>

</body>
</html>
