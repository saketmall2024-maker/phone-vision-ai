<!DOCTYPE html>
<html>
<head>
  <title>ESP Chat</title>
</head>
<body>

<h2>ESP Chat (GitHub UI)</h2>

<input type="text" id="msg" placeholder="Type message">
<button onclick="send()">Send</button>

<br><br>

<iframe id="chatbox" width="100%" height="300"></iframe>

<script>
const espIP = "192.168.0.100";

function send() {
  let msg = document.getElementById("msg").value;
  fetch(`http://${espIP}/send?msg=${msg}`, {mode: "no-cors"});
}

setInterval(() => {
  document.getElementById("chatbox").src = `http://${espIP}`;
}, 2000);
</script>

</body>
</html>
